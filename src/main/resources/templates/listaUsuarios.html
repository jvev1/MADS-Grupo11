<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Usuarios registrados')"></head>

<body>
<div th:replace="fragments :: menu"></div>
<div class="container-fluid">

    <div class="row mt-3">
        <div class="col">
            <h2>Listado de usuarios</h2>
        </div>
    </div>

    <div class="row mt-3" th:if="${error != null}">
        <div class="col">
            <div class="alert alert-danger" th:text="${error}"></div>
        </div>
    </div>

    <div class="row mt-3">
        <div class="col">
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>Id</th>
                    <th>Email</th>
                    <th>Descripción</th>
                    <th>Estado</th>
                    <th>Acceso</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="usuario: ${usuarios}">
                    <td th:text="${usuario.id}"></td>
                    <td th:text="${usuario.email}"></td>
                    <td><a class="btn btn-primary btn-xs" th:href="@{/registrados/{id}(id=${usuario.id})}">Ver descripción</a></td>
                    <td>
                        <span class="badge badge-danger bg-danger" th:if="${usuario.bloqueado}">Bloqueado</span>
                        <span class="badge badge-success bg-success" th:unless="${usuario.bloqueado}">Activo</span>
                    </td>
                    <td>
                        <form th:unless="${usuario.admin}" method="post" th:action="@{/registrados/{id}/bloqueo(id=${usuario.id})}">
                            <button type="submit" class="btn btn-xs"
                                    th:classappend="${usuario.bloqueado} ? 'btn-success' : 'btn-danger'"
                                    th:text="${usuario.bloqueado} ? 'Habilitar' : 'Bloquear'"></button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="fragments::javascript"/>

</body>
</html>
