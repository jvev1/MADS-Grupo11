# Perfil de PRODUCCION: igual que el perfil postgres, pero sin tocar el esquema de la BD

# Valores por defecto; se pueden cambiar al lanzar la app (ej. --POSTGRES_HOST=postgres en Docker)
POSTGRES_HOST=localhost
POSTGRES_PORT=5432
DB_USER=mads
DB_PASSWD=mads

# Conexion a la base de datos "mads" usando las variables de arriba
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/mads
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWD}
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQL9Dialect

# validate: Hibernate solo comprueba que las tablas coinciden con las entidades.
# No crea ni modifica tablas, para no perder datos en produccion.
spring.jpa.hibernate.ddl-auto=validate